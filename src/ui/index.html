<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Tembo</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<script src="boot.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m-5-5 5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-desk" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M3 5h18v11H3zM9 20h6M12 16v4"/></symbol>
  <symbol id="i-dup" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M8 8h11v11H8zM5 16V5h11"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M6 3h8l4 4v14H6zM9 12h6M9 16h6"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M4 4h16v16H4zM4 10h16M4 15h16M10 4v16"/></symbol>
  <symbol id="i-slides" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M3 4h18v12H3zM12 16v4M8 20h8"/></symbol>
  <symbol id="i-img" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M3 6h13v12H3zM16 10l5-3v10l-5-3"/></symbol>
  <symbol id="i-app" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12 4 7.5"/></symbol>
  <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></symbol>
  <symbol id="i-zip" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M5 3h14v18H5zM12 3v4m0 2v2m0 2v2"/></symbol>
  <symbol id="i-code" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m8 7-5 5 5 5m8-10 5 5-5 5"/></symbol>
  <symbol id="i-font" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 20 11 4h2l6 16M8 14h8"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M3 6h6l2 2h10v11H3z"/></symbol>
  <symbol id="i-game" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M6 8h12a4 4 0 0 1 4 4v1a4 4 0 0 1-7 2.6L13.5 14h-3L9 15.6A4 4 0 0 1 2 13v-1a4 4 0 0 1 4-4z"/><path stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="12" r="1.2" fill="currentColor"/><circle cx="18" cy="14" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></symbol>
  <symbol id="i-window" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M3 5h18v14H3zM3 9h18"/><circle cx="6" cy="7" r=".9" fill="currentColor"/><circle cx="9" cy="7" r=".9" fill="currentColor"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M3 5h18v14H3zM7 10l3 2-3 2M12 15h5"/></symbol>
  <symbol id="i-brush" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M20 4 11 13M9 14c-2 0-4 1.5-4 4 0 1-1 2-2 2 2 1 6 1 7.5-1 1-1.3.5-3.5-1.5-5z"/></symbol>
  <symbol id="i-cube" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" d="M12 3 20 7.5v9L12 21l-8-4.5v-9zM4 7.5 12 12l8-4.5M12 12v9"/></symbol>
  <symbol id="i-wave" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M3 12h2M7 8v8M11 4v16M15 7v10M19 10v4M21 12h0"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
</svg>

<div class="drag"></div>

<div class="win">
  <aside class="side">
    <label class="search"><svg><use href="#i-search"/></svg><input id="search" type="search" placeholder="Поиск файла" autocomplete="off"></label>
    <div class="cards">
      <button class="card" id="card-downloads"><span class="hd"><span class="ic" style="background:#1a7cff"><svg><use href="#i-down"/></svg></span><span class="n">–</span></span><span class="ct">Загрузки</span></button>
      <button class="card" id="card-desktop"><span class="hd"><span class="ic" style="background:#5ac8fa"><svg><use href="#i-desk"/></svg></span><span class="n">–</span></span><span class="ct">Рабочий стол</span></button>
      <button class="card" id="card-duplicates"><span class="hd"><span class="ic" style="background:#5e5ce6"><svg><use href="#i-dup"/></svg></span><span class="n">–</span></span><span class="ct">Дубликаты</span></button>
      <button class="card" id="card-unsorted"><span class="hd"><span class="ic" style="background:#ff9f0a"><svg><use href="#i-eye"/></svg></span><span class="n">–</span></span><span class="ct">На проверку</span></button>
    </div>
    <div>
      <div class="grp">Недавние папки</div>
      <div class="list" id="recent"></div>
      <button class="li" id="pick"><span class="ic" style="background:#8e8e93"><svg><use href="#i-plus"/></svg></span>Другая папка…</button>
    </div>
    <div class="update" id="update" hidden>
      <div><b id="update-title"></b><span id="update-text"></span></div>
      <button class="btn pri" id="update-btn" hidden>Перезапустить</button>
    </div>
  </aside>

  <main class="main">
    <canvas id="rain" aria-hidden="true"></canvas>
    <section id="plan-view" class="view">
      <header class="head">
        <div class="head-t"><h1 id="title">Загрузки</h1><div class="sub" id="subtitle"></div></div>
        <span class="big" id="count"></span>
      </header>
      <div class="body">
        <div class="dashcol">
          <div class="tile orb-t">
            <div class="orb">
              <svg viewBox="0 0 200 200" aria-hidden="true">
                <defs>
                  <clipPath id="orbclip"><circle cx="100" cy="100" r="98"/></clipPath>
                  <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6cc6ff"/><stop offset="1" stop-color="#1a6dff"/></linearGradient>
                </defs>
                <g clip-path="url(#orbclip)">
                  <g class="level" id="level"><g class="slosh">
                    <path class="w2" fill="#7cc4ff" opacity=".45" d="M-240 -8 q30 -12 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 V400 H-240 Z"/>
                    <path class="w1" fill="url(#liq)" d="M-240 0 q30 10 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 V400 H-240 Z"/>
                  </g></g>
                </g>
              </svg>
              <div class="v"><b id="pct">–</b></div>
            </div>
            <div><h4>Уже на местах</h4><div class="s" id="pct-text"></div></div>
          </div>
          <div class="tile" id="composition">
            <h4>Что предстоит разобрать</h4><div class="s" id="comp-sub"></div>
            <div class="bar" id="bar"></div>
            <div class="legend" id="legend"></div>
          </div>
        </div>
        <div class="listcol">
          <div class="scroll" id="list"></div>
          <div class="dock">
            <span class="dock-t" id="selinfo"></span>
            <label class="opt" id="arrange-wrap" hidden><input type="checkbox" id="arrange-opt" checked>Расставить значки по группам</label>
            <button class="btn" id="arrange-only" hidden>Только расставить значки</button>
            <button class="btn" id="undo-last" hidden>Отменить прошлое</button>
            <button class="btn pri" id="apply" disabled>Разобрать</button>
          </div>
        </div>
      </div>
    </section>

    <section id="done-view" class="view" hidden>
      <div class="done">
        <div class="halo"><svg><use href="#i-check"/></svg></div>
        <h1 id="done-title"></h1>
        <p id="done-text"></p>
        <div class="failed" id="failed" hidden></div>
        <div class="btns">
          <button class="btn" id="undo">Отменить</button>
          <button class="btn" id="open">Открыть в Проводнике</button>
          <button class="btn pri" id="again">Готово</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="app.js"></script>
<script src="rain.js"></script>
</body>
</html>
