[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tembo"
version = "0.1.0"
description = "Smart, safe file organizer: rules first, Claude only where meaning matters."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tembo = "tembo.cli:main"

[tool.setuptools]
packages = ["tembo"]
